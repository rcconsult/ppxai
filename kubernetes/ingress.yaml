# Kubernetes Ingress for ppxai-server (nginx)
#
# Prerequisites:
#   1. Install nginx ingress controller:
#      kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.4/deploy/static/provider/cloud/deploy.yaml
#
#   2. (Optional) For TLS, create a secret:
#      kubectl create secret tls ppxai-tls \
#        --cert=path/to/tls.crt \
#        --key=path/to/tls.key
#
# Usage:
#   Update the host to match your domain, then:
#   kubectl apply -f kubernetes/ingress.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ppxai-server
  labels:
    app: ppxai-server
    app.kubernetes.io/name: ppxai-server
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # SSE support - disable buffering for streaming responses
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
spec:
  ingressClassName: nginx
  rules:
    - host: ppxai.example.com  # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ppxai-server
                port:
                  name: http
  # Uncomment for TLS
  # tls:
  #   - hosts:
  #       - ppxai.example.com
  #     secretName: ppxai-tls
