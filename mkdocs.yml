site_name: ppxai Documentation
site_description: Multi-LLM Interface for Developers - Terminal & VSCode
site_url: https://rcconsult.github.io/ppxai/
repo_url: https://github.com/rcconsult/ppxai
repo_name: rcconsult/ppxai
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Provider Setup: provider-setup.md
  - User Guides:
    - Task Agent Platform: task-agent-guide.md
    - Session Agent Mode: session-agent-guide.md
    - Bootstrap Context: bootstrap-context-guide.md
    - Context Injection: context-injection.md
    - Checkpoint & Undo: checkpoint-guide.md
    - File Editing: file-editing-guide.md
    - Shell Consent: shell-consent-guide.md
  - Development:
    - Custom Tools: custom-tool-development-guide.md
    - Custom Commands: custom-command-development-guide.md
    - Architecture: architecture.md
  - Reference:
    - Ollama Limitations: ollama-limitations.md
    - vLLM Tool Calling: vllm-tool-calling-guide.md
    - Container Tools: container-tools-guide.md
    - Autorouter Config: autorouter-config.md
  - Release Notes:
    - v1.16.1: RELEASE-NOTES-v1.16.1.md
    - v1.16.0: RELEASE-NOTES-v1.16.0.md
    - v1.15.6: RELEASE-NOTES-v1.15.6.md

plugins:
  - search
  - mike:
      version_selector: true
      css_dir: css
      javascript_dir: js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rcconsult/ppxai
