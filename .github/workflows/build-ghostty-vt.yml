name: Build libghostty-vt
# Builds libghostty-vt shared libraries for all platforms using Zig
# cross-compilation from a single Linux runner, then publishes them
# as GitHub release assets in the ppxai repo.
#
# Cross-compilation avoids platform-specific build issues:
# - macos-13 runners deprecated
# - Windows native build has Zig path-handling panic
# - Zig cross-compiles cleanly to all targets from Linux

on:
  workflow_dispatch:
    inputs:
      ghostty_ref:
        description: 'Ghostty commit/branch/tag to build from'
        required: true
        default: 'main'
      release_tag:
        description: 'Release tag for the built artifacts (e.g., libghostty-20260319)'
        required: true
        default: 'libghostty-latest'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Checkout Ghostty
        uses: actions/checkout@v4
        with:
          repository: ghostty-org/ghostty
          ref: ${{ inputs.ghostty_ref }}

      - name: Record commit SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build all targets
        run: |
          set -e
          mkdir -p dist/lib

          echo "=== Building Linux amd64 ==="
          zig build lib-vt -Doptimize=ReleaseSafe
          find zig-out/ -name "*.so" | head -1 | xargs -I{} cp {} dist/lib/libghostty_vt-linux-amd64.so
          rm -rf zig-out .zig-cache

          echo "=== Building macOS ARM64 ==="
          zig build lib-vt -Doptimize=ReleaseSafe -Dtarget=aarch64-macos
          find zig-out/ -name "*.dylib" | head -1 | xargs -I{} cp {} dist/lib/libghostty_vt-macos-arm64.dylib
          rm -rf zig-out .zig-cache

          echo "=== Building macOS Intel ==="
          zig build lib-vt -Doptimize=ReleaseSafe -Dtarget=x86_64-macos
          find zig-out/ -name "*.dylib" | head -1 | xargs -I{} cp {} dist/lib/libghostty_vt-macos-intel.dylib
          rm -rf zig-out .zig-cache

          echo "=== Building Windows amd64 ==="
          zig build lib-vt -Doptimize=ReleaseSafe -Dtarget=x86_64-windows-gnu
          find zig-out/ -name "*.dll" | head -1 | xargs -I{} cp {} dist/lib/ghostty_vt-windows-amd64.dll
          rm -rf zig-out .zig-cache

          echo "=== All builds complete ==="
          ls -la dist/lib/

      - name: Package headers
        run: |
          cp -r include/ghostty dist/include-ghostty
          tar czf dist/lib/ghostty-vt-headers.tar.gz -C dist include-ghostty
          echo "Built from ghostty-org/ghostty@${{ steps.sha.outputs.sha }}" > dist/lib/BUILD_INFO.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libghostty-vt-all
          path: dist/lib/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ppxai
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: libghostty-vt-all
          path: release/

      - name: List artifacts
        run: ls -la release/

      - name: Create release notes
        run: |
          cat > release/NOTES.md << 'EOF'
          Pre-built libghostty-vt shared libraries for ppxai.

          Libraries:
          - libghostty_vt-linux-amd64.so - Linux x86_64
          - libghostty_vt-macos-arm64.dylib - macOS Apple Silicon
          - libghostty_vt-macos-intel.dylib - macOS Intel
          - ghostty_vt-windows-amd64.dll - Windows x86_64
          - ghostty-vt-headers.tar.gz - C API headers

          Build-time artifacts for ppxai release pipeline.
          EOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "libghostty-vt ($TAG)" \
            --notes-file release/NOTES.md \
            --prerelease \
            release/libghostty_vt-linux-amd64.so \
            release/libghostty_vt-macos-arm64.dylib \
            release/libghostty_vt-macos-intel.dylib \
            release/ghostty_vt-windows-amd64.dll \
            release/ghostty-vt-headers.tar.gz \
            release/BUILD_INFO.txt
