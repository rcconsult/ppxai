name: Build libghostty-vt
# Builds libghostty-vt shared libraries for all platforms and publishes
# them as GitHub release assets in the ppxai repo.
#
# Strategy: native builds for Linux/macOS, cross-compile Windows from Linux.
# macOS Intel is cross-compiled from macOS ARM runner (same OS, different arch).

on:
  workflow_dispatch:
    inputs:
      ghostty_ref:
        description: 'Ghostty commit/branch/tag to build from'
        required: true
        default: 'main'
      release_tag:
        description: 'Release tag for the built artifacts (e.g., libghostty-20260319)'
        required: true
        default: 'libghostty-latest'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: ''
            artifact_name: libghostty_vt-linux-amd64.so
            lib_glob: '*.so'
          - os: macos-latest
            target: ''
            artifact_name: libghostty_vt-macos-arm64.dylib
            lib_glob: '*.dylib'
          - os: macos-latest
            target: '-Dtarget=x86_64-macos'
            artifact_name: libghostty_vt-macos-intel.dylib
            lib_glob: '*.dylib'
          - os: ubuntu-latest
            target: '-Dtarget=x86_64-windows-gnu'
            artifact_name: ghostty_vt-windows-amd64.dll
            lib_glob: '*.dll'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Checkout Ghostty
        uses: actions/checkout@v4
        with:
          repository: ghostty-org/ghostty
          ref: ${{ inputs.ghostty_ref }}

      - name: Record commit SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build libghostty-vt
        run: |
          # Try new default install step first, fall back to legacy lib-vt step
          zig build -Doptimize=ReleaseSafe ${{ matrix.target }} || \
          zig build lib-vt -Doptimize=ReleaseSafe ${{ matrix.target }}

      - name: List build output
        run: find zig-out/ -type f 2>/dev/null || echo "No zig-out directory"

      - name: Package artifact
        run: |
          mkdir -p dist
          find zig-out/ -name "${{ matrix.lib_glob }}" | head -1 | xargs -I{} cp {} dist/${{ matrix.artifact_name }}
          echo "Built from ghostty-org/ghostty@${{ steps.sha.outputs.sha }}" > dist/BUILD_INFO.txt
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ppxai
        uses: actions/checkout@v4

      - name: Checkout Ghostty (for headers)
        uses: actions/checkout@v4
        with:
          repository: ghostty-org/ghostty
          ref: ${{ inputs.ghostty_ref }}
          path: ghostty-src

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release files
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "$dir"/* release/ 2>/dev/null || true
          done
          tar czf release/ghostty-vt-headers.tar.gz -C ghostty-src/include ghostty
          echo "Built from ghostty-org/ghostty@${{ inputs.ghostty_ref }}" > release/BUILD_INFO.txt
          ls -la release/

      - name: Create release notes
        run: |
          cat > release/NOTES.md << 'EOF'
          Pre-built libghostty-vt shared libraries for ppxai.

          Libraries:
          - libghostty_vt-linux-amd64.so - Linux x86_64
          - libghostty_vt-macos-arm64.dylib - macOS Apple Silicon
          - libghostty_vt-macos-intel.dylib - macOS Intel
          - ghostty_vt-windows-amd64.dll - Windows x86_64
          - ghostty-vt-headers.tar.gz - C API headers

          Build-time artifacts for ppxai release pipeline.
          EOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "libghostty-vt ($TAG)" \
            --notes-file release/NOTES.md \
            --prerelease \
            release/libghostty_vt-linux-amd64.so \
            release/libghostty_vt-macos-arm64.dylib \
            release/libghostty_vt-macos-intel.dylib \
            release/ghostty_vt-windows-amd64.dll \
            release/ghostty-vt-headers.tar.gz \
            release/BUILD_INFO.txt
