name: Deploy Documentation

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.14.2)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mkdocs-material mike

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "alias=latest" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "alias=latest" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
            echo "alias=" >> $GITHUB_OUTPUT
          fi

      - name: Deploy docs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ALIAS="${{ steps.version.outputs.alias }}"

          # Fetch gh-pages branch if it exists
          git fetch origin gh-pages:gh-pages || true

          # Set descriptive title based on version
          if [ "$VERSION" = "dev" ]; then
            TITLE="Development (Unreleased)"
          elif [ -n "$ALIAS" ]; then
            TITLE="$VERSION (Latest)"
          else
            TITLE="$VERSION"
          fi

          # Deploy with retry to handle concurrent push conflicts
          for attempt in 1 2 3; do
            if [ -n "$ALIAS" ]; then
              mike deploy --push --update-aliases --title "$TITLE" "$VERSION" "$ALIAS" && break
            else
              mike deploy --push --title "$TITLE" "$VERSION" && break
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
            git fetch origin gh-pages:gh-pages --force
          done

      - name: Retitle previous versions
        if: steps.version.outputs.alias == 'latest'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git fetch origin gh-pages:gh-pages --force || true

          # Remove stale "(Latest)" from previous version titles
          # mike list output format varies; strip quotes and brackets to extract clean version
          mike list 2>/dev/null | grep "(Latest)" | grep -v "$VERSION" | while read -r line; do
            OLD_VER=$(echo "$line" | awk '{print $1}' | tr -d '"' | tr -d '[' | tr -d ']')
            if [ -n "$OLD_VER" ] && [ "$OLD_VER" != "$VERSION" ]; then
              echo "Retitling $OLD_VER to remove stale (Latest) label"
              mike retitle --push "$OLD_VER" "$OLD_VER"
            fi
          done

      - name: Set default version
        if: steps.version.outputs.alias == 'latest'
        run: |
          git fetch origin gh-pages:gh-pages --force || true
          mike set-default --push latest
