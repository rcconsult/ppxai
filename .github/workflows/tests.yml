name: Tests

# WHY THIS EXISTS, SEPARATELY FROM build.yml
#
# build.yml runs this same suite and gates every build job on it -- but it
# triggers ONLY on a `v*` tag. So a branch can accumulate commits with zero
# automated verification, and the first run of the suite is the release
# itself. That is not hypothetical: bugfix/v1.19.1 reached 73 commits and 48
# changed production files over 11 days with no CI run, and three real
# defects were found only once something forced a local run. One of them
# (PtyProcess.kill, eace6fff) made a full local run impossible for four of
# those days, so nobody noticed the other two.
#
# This is a NEW workflow rather than new triggers on build.yml on purpose:
# build.yml's six build jobs -- four of them 3-OS PyInstaller matrices --
# would fire on every push, and its release path should not be perturbed to
# get a test gate.
#
# Deliberately NOT copied from build.yml's test job: the benchmark step. It
# makes live provider calls with PERPLEXITY_API_KEY / GEMINI_API_KEY, which
# costs real money per run and whose secrets are unavailable to pull
# requests from forks. Benchmarking stays a release-time concern.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref -- pushing three
  # times in a minute should not queue three full suites.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    # A hang must fail in minutes, not burn GitHub's default 360-minute cap.
    # pytest-timeout is NOT installed, so pytest will not self-limit; the
    # PtyProcess.kill hang parked a local run indefinitely rather than
    # failing. The suite takes ~5 minutes locally, so 30 is generous
    # headroom that still bounds a hang.
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --frozen --all-extras

    # TEMPORARY (2026-09-06) -- diagnosing the Linux-only trust-store cluster
    # in test_tls_config.py / test_web_tools_ssl.py. Those tests count roots
    # with get_ca_certs(), which reports only ENUMERABLE certs: a capath store
    # loads lazily and enumerates as empty even when verification works. So an
    # empty count has two incompatible causes -- a measurement artifact, or a
    # context that really trusts nothing -- and they need opposite fixes.
    # The handshake below is what separates them. Remove this step once the
    # cluster is fixed.
    - name: Diagnose TLS trust store
      continue-on-error: true
      run: |
        uv run python - <<'PYEOF'
        import socket, ssl, sys
        from pathlib import Path

        print("python     :", sys.version.replace("\n", " "))
        print("executable :", sys.executable)
        print("openssl    :", ssl.OPENSSL_VERSION)

        paths = ssl.get_default_verify_paths()
        print("\n-- compiled-in default verify paths --")
        for name in ("cafile", "capath", "openssl_cafile", "openssl_capath"):
            val = getattr(paths, name)
            exists = Path(val).exists() if val else False
            print(f"  {name:16} {val!r:60} exists={exists}")

        default_ctx = ssl.create_default_context()
        print("\n-- enumerable root counts --")
        print("  create_default_context()      :", len(default_ctx.get_ca_certs()))

        import certifi
        print("  certifi.where()               :", certifi.where())
        print("  certifi BEGIN CERTIFICATE     :", certifi.contents().count("BEGIN CERTIFICATE"))

        sys.path.insert(0, ".")
        from ppxai.config import tls as tlsmod
        prod_ctx = tlsmod.tls_ssl_context()
        print("  tls_ssl_context()             :", len(prod_ctx.get_ca_certs()))

        # THE DECISIVE CHECK. If this handshake succeeds, an empty
        # get_ca_certs() is a measurement artifact and only the tests are
        # wrong. If it fails, ppxai trusts nothing on this interpreter and
        # the defect is in production code, not in the assertions.
        print("\n-- real handshake against a public endpoint --")
        for label, ctx in (("create_default_context", default_ctx),
                           ("tls_ssl_context", prod_ctx)):
            try:
                with socket.create_connection(("www.google.com", 443), timeout=10) as sock:
                    with ctx.wrap_socket(sock, server_hostname="www.google.com") as ss:
                        peer = ss.getpeercert()
                print(f"  {label:24} OK   verified subject={peer.get('subject')}")
            except Exception as exc:
                print(f"  {label:24} FAIL {type(exc).__name__}: {exc}")
        PYEOF

    # -v on purpose: with per-test output, a parked run names the test it
    # stopped on. Under -q a hang is an anonymous row of dots.
    - name: Run Python tests
      run: uv run pytest tests/ -v --ignore=tests/test_custom_endpoint_integration.py --ignore=tests/e2e

  e2e:
    runs-on: ubuntu-latest
    # Separate job, not a later step: E2E needs Node and not the Python
    # environment, and an E2E failure should be attributable on its own
    # rather than hidden behind a Python failure that stopped the job first.
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Install Playwright dependencies
      working-directory: tests/e2e
      run: npm ci

    - name: Install Playwright browsers
      working-directory: tests/e2e
      run: npx playwright install chromium --with-deps

    # The default project drives the static file:// harness. live-app.spec.ts
    # needs a real ppxai-server and is opt-in via `npm run test:live`, so it
    # does not run here.
    - name: Run E2E tests
      working-directory: tests/e2e
      run: npx playwright test
