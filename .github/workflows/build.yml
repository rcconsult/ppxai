name: Build Executables

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --frozen --all-extras

    # A ratchet, not a gate. `ruff check .` reports ~3.9k findings, so failing
    # on all of them would fail every build forever and get switched off in a
    # week. These rules are at ZERO today and must stay there: each one is a
    # name that resolves to nothing at runtime, which is a defect rather than
    # style. Item 67 found ten live F821s this way — two inside `except`
    # handlers, where the error path itself raised NameError.
    #
    # Widen this list as classes reach zero; that is how the backlog gets paid
    # down without a flag day. The full count is deliberately NOT gated yet.
    - name: Lint (undefined names — must stay at zero)
      run: uv run ruff check . --select F821,F822,F823,F632

    - name: Run Python tests
      run: uv run pytest tests/ -v --ignore=tests/test_custom_endpoint_integration.py --ignore=tests/e2e

    - name: Setup Node.js for E2E tests
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Install Playwright dependencies
      working-directory: tests/e2e
      run: npm ci

    - name: Install Playwright browsers
      working-directory: tests/e2e
      run: npx playwright install chromium --with-deps

    - name: Run E2E tests
      working-directory: tests/e2e
      run: npx playwright test

    - name: Run benchmark
      env:
        PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: uv run python scripts/benchmark.py --all-providers --iterations 2 --no-save

  build-tui:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ppxai
            asset_name: ppxai-linux-amd64
          - os: macos-latest
            artifact_name: ppxai
            asset_name: ppxai-macos-arm64
          - os: windows-latest
            artifact_name: ppxai.exe
            asset_name: ppxai-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      # v1.18.1: --all-extras matches the test job above. The TUI
      # binary's command system dynamically loads every module under
      # ppxai.commands.* (factory.py::_ensure_loaded), and the
      # /attach pipeline transitively imports pypdf / pypdfium2 /
      # openpyxl / python-pptx for file preprocessing. Building with
      # only [build] silently drops those — PyInstaller emits a
      # warning, the binary builds, and runtime imports fail when the
      # user attaches a PDF. Use --all-extras to keep the build venv
      # in sync with every spec hiddenimport.
      run: uv sync --frozen --all-extras

    - name: Build with PyInstaller
      run: uv run pyinstaller ppxai.spec

    - name: Verify build (Unix)
      if: runner.os != 'Windows'
      run: |
        ls -lh dist/
        file dist/${{ matrix.artifact_name }}

    - name: Verify build (Windows)
      if: runner.os == 'Windows'
      run: |
        dir dist\

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.artifact_name }}

  build-server:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ppxai-server
            asset_name: ppxai-server-linux-amd64
          - os: macos-latest
            artifact_name: ppxai-server
            asset_name: ppxai-server-macos-arm64
          - os: windows-latest
            artifact_name: ppxai-server.exe
            asset_name: ppxai-server-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      # v1.18.1: --all-extras matches the test job. ppxai-server.spec
      # hiddenimports include pypdf, pypdfium2, openpyxl, python-pptx
      # ([data] extras), google.genai ([gemini]), and ddgs ([search])
      # — all consumed via dynamic-import paths the static analyzer
      # can't see. Without --all-extras, PyInstaller silently drops
      # them and ships a binary missing PDF rasterization, Excel
      # tooling, native Gemini, and web search. Bug pre-dates
      # v1.18.1; surfaced during release pre-flight audit.
      run: uv sync --frozen --all-extras

    - name: Build server with PyInstaller
      run: uv run pyinstaller ppxai-server.spec

    - name: Verify build (Unix)
      if: runner.os != 'Windows'
      run: |
        ls -lh dist/
        file dist/${{ matrix.artifact_name }}

    - name: Verify build (Windows)
      if: runner.os == 'Windows'
      run: |
        dir dist\

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.artifact_name }}

  build-tui-textual:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ppxaide
            asset_name: ppxaide-linux-amd64
          - os: macos-latest
            artifact_name: ppxaide
            asset_name: ppxaide-macos-arm64
          - os: windows-latest
            artifact_name: ppxaide.exe
            asset_name: ppxaide-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      # v1.18.1: see build-tui job for the rationale — Textual TUI
      # also drives the command factory + /attach pipeline.
      run: uv sync --frozen --all-extras

    - name: Build with PyInstaller
      run: uv run pyinstaller ppxaide.spec

    - name: Verify build (Unix)
      if: runner.os != 'Windows'
      run: |
        ls -lh dist/
        file dist/${{ matrix.artifact_name }}

    - name: Verify build (Windows)
      if: runner.os == 'Windows'
      run: |
        dir dist\

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.artifact_name }}

  build-desktop:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ppxai-desktop
            asset_name: ppxai-desktop-linux-amd64
          - os: macos-latest
            artifact_name: ppxai-desktop
            asset_name: ppxai-desktop-macos-arm64
          - os: windows-latest
            artifact_name: ppxai-desktop.exe
            asset_name: ppxai-desktop-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      # ppxai-desktop is a thin launcher (~minimal hiddenimports), but
      # use --all-extras for consistency with the other build jobs.
      # Adds <2s to the install step.
      run: uv sync --frozen --all-extras

    - name: Build desktop with PyInstaller
      run: uv run pyinstaller ppxai-desktop.spec

    - name: Verify build (Unix)
      if: runner.os != 'Windows'
      run: |
        ls -lh dist/
        file dist/${{ matrix.artifact_name }}

    - name: Verify build (Windows)
      if: runner.os == 'Windows'
      run: |
        dir dist\

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.artifact_name }}

  build-web-ui:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Get version
      id: version
      run: echo "version=$(grep 'version = ' pyproject.toml | head -1 | cut -d'"' -f2)" >> $GITHUB_OUTPUT

    - name: Package web UI
      run: |
        cd ppxai/web
        zip -r ../../ppxai-web-ui-${{ steps.version.outputs.version }}.zip .

    - name: Upload web UI artifact
      uses: actions/upload-artifact@v5
      with:
        name: ppxai-web-ui-${{ steps.version.outputs.version }}.zip
        path: ppxai-web-ui-${{ steps.version.outputs.version }}.zip

  build-vscode:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: vscode-extension/package-lock.json

    - name: Install dependencies
      working-directory: vscode-extension
      run: npm ci

    - name: Lint
      working-directory: vscode-extension
      run: npm run lint

    # Item 5 (v1.18.2): bundled via esbuild. `npm run typecheck` runs
    # `tsc -p ./ --noEmit` to catch type errors before bundling
    # (esbuild itself does not type-check). The subsequent
    # `vsce package` step triggers the `vscode:prepublish` script,
    # which runs `npm run package` — typecheck + esbuild --production
    # — so the shipped bundle is always the minified one even if a
    # human runs the steps out of order locally.
    - name: Type check
      working-directory: vscode-extension
      run: npm run typecheck

    - name: Package VSIX
      working-directory: vscode-extension
      run: npx vsce package --allow-missing-repository

    - name: Verify bundle size budget
      working-directory: vscode-extension
      shell: bash
      run: |
        # Item 5 budget: post-bundle VSIX should stay under 500 KB.
        # Pre-bundle baseline was ~1.1 MB. If this gate fails, the
        # bundle has likely picked up an unintended dependency —
        # inspect `npx vsce ls` to see what got pulled in.
        size=$(stat -c%s ppxai-*.vsix 2>/dev/null || stat -f%z ppxai-*.vsix)
        echo "VSIX size: ${size} bytes"
        if [ "${size}" -gt 524288 ]; then
          echo "::error::VSIX size ${size} bytes exceeds 500 KB budget."
          exit 1
        fi

    - name: Get version
      id: version
      run: echo "version=$(node -p "require('./vscode-extension/package.json').version")" >> $GITHUB_OUTPUT

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v5
      with:
        name: ppxai-vscode-${{ steps.version.outputs.version }}.vsix
        path: vscode-extension/*.vsix

  build-dmg:
    needs: [build-tui, build-tui-textual, build-desktop, build-server]
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download Rich TUI artifact
      uses: actions/download-artifact@v5
      with:
        name: ppxai-macos-arm64
        path: dist/

    - name: Download Textual TUI artifact
      uses: actions/download-artifact@v5
      with:
        name: ppxaide-macos-arm64
        path: dist/

    - name: Download desktop artifact
      uses: actions/download-artifact@v5
      with:
        name: ppxai-desktop-macos-arm64
        path: dist/

    - name: Download server artifact
      uses: actions/download-artifact@v5
      with:
        name: ppxai-server-macos-arm64
        path: dist/

    - name: Get version
      id: version
      run: echo "version=$(grep 'version = ' pyproject.toml | head -1 | cut -d'"' -f2)" >> $GITHUB_OUTPUT

    - name: Create app bundle and DMG
      run: |
        # Rename binaries
        mv dist/ppxai-desktop dist/ppxai-desktop-bin
        mv dist/ppxai-server dist/ppxai-server-bin

        # Create .app bundle structure
        APP_DIR="dist/ppxai.app"
        mkdir -p "$APP_DIR/Contents/MacOS"
        mkdir -p "$APP_DIR/Contents/Resources/web"

        # Copy binaries
        cp dist/ppxai-desktop-bin "$APP_DIR/Contents/MacOS/ppxai-desktop"
        cp dist/ppxai-server-bin "$APP_DIR/Contents/MacOS/ppxai-server"
        chmod +x "$APP_DIR/Contents/MacOS/ppxai-desktop"
        chmod +x "$APP_DIR/Contents/MacOS/ppxai-server"

        # Copy web UI files
        cp -r ppxai/web/* "$APP_DIR/Contents/Resources/web/"

        # Copy app icon
        if [ -f "resources/ppxai.icns" ]; then
            cp resources/ppxai.icns "$APP_DIR/Contents/Resources/AppIcon.icns"
        fi

        # Create Info.plist
        cat > "$APP_DIR/Contents/Info.plist" << 'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleName</key>
            <string>ppxai</string>
            <key>CFBundleDisplayName</key>
            <string>ppxai Desktop</string>
            <key>CFBundleIdentifier</key>
            <string>com.ppxai.desktop</string>
            <key>CFBundleVersion</key>
            <string>${{ steps.version.outputs.version }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ steps.version.outputs.version }}</string>
            <key>CFBundleExecutable</key>
            <string>ppxai-desktop</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.13</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        PLIST

        # Create DMG with all binaries
        DMG_CONTENTS="dist/dmg-contents"
        mkdir -p "$DMG_CONTENTS"
        mkdir -p "$DMG_CONTENTS/CLI Tools"

        # Copy .app bundle
        cp -r "$APP_DIR" "$DMG_CONTENTS/"
        ln -s /Applications "$DMG_CONTENTS/Applications"

        # Copy CLI binaries for terminal users
        cp dist/ppxai "$DMG_CONTENTS/CLI Tools/ppxai"
        cp dist/ppxaide "$DMG_CONTENTS/CLI Tools/ppxaide"
        cp dist/ppxai-server-bin "$DMG_CONTENTS/CLI Tools/ppxai-server"
        chmod +x "$DMG_CONTENTS/CLI Tools/"*

        # Add README for CLI tools
        cat > "$DMG_CONTENTS/CLI Tools/README.txt" << 'EOF'
        ppxai CLI Tools
        ===============

        Installation:

        1. Copy binaries to ~/.local/bin (recommended):

           mkdir -p ~/.local/bin
           cp ppxai ppxaide ppxai-server ~/.local/bin/

        2. Add ~/.local/bin to PATH (if not already):

           # For zsh (~/.zshrc):
           echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.zshrc
           source ~/.zshrc

           # For bash (~/.bashrc or ~/.bash_profile):
           echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
           source ~/.bashrc

        3. Run:

           ppxai         - Rich TUI (original)
           ppxaide       - Textual TUI (v1.15.0+ - modern async)
           ppxai-server  - HTTP server for VSCode extension

        Alternative: Use the automated installer:

           curl -sSL https://raw.githubusercontent.com/rcconsult/ppxai/master/install.sh | bash

        More info: https://github.com/rcconsult/ppxai
        EOF

        hdiutil create -volname "ppxai ${{ steps.version.outputs.version }}" \
            -srcfolder "$DMG_CONTENTS" \
            -ov -format UDZO \
            "dist/ppxai-${{ steps.version.outputs.version }}-macos-arm64.dmg"

        rm -rf "$DMG_CONTENTS"
        ls -lh dist/*.dmg

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v5
      with:
        name: ppxai-${{ steps.version.outputs.version }}-macos-arm64.dmg
        path: dist/ppxai-${{ steps.version.outputs.version }}-macos-arm64.dmg

  release:
    needs: [build-tui, build-tui-textual, build-server, build-desktop, build-web-ui, build-vscode, build-dmg]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v5
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: ls -R artifacts/

    - name: Rename artifacts for release
      run: |
        # Rich TUI binaries
        mv artifacts/ppxai-linux-amd64/ppxai artifacts/ppxai-linux-amd64/ppxai-linux-amd64
        mv artifacts/ppxai-macos-arm64/ppxai artifacts/ppxai-macos-arm64/ppxai-macos-arm64
        mv artifacts/ppxai-windows.exe/ppxai.exe artifacts/ppxai-windows.exe/ppxai-windows.exe
        # Textual TUI binaries
        mv artifacts/ppxaide-linux-amd64/ppxaide artifacts/ppxaide-linux-amd64/ppxaide-linux-amd64
        mv artifacts/ppxaide-macos-arm64/ppxaide artifacts/ppxaide-macos-arm64/ppxaide-macos-arm64
        mv artifacts/ppxaide-windows.exe/ppxaide.exe artifacts/ppxaide-windows.exe/ppxaide-windows.exe
        # Server binaries
        mv artifacts/ppxai-server-linux-amd64/ppxai-server artifacts/ppxai-server-linux-amd64/ppxai-server-linux-amd64
        mv artifacts/ppxai-server-macos-arm64/ppxai-server artifacts/ppxai-server-macos-arm64/ppxai-server-macos-arm64
        mv artifacts/ppxai-server-windows.exe/ppxai-server.exe artifacts/ppxai-server-windows.exe/ppxai-server-windows.exe
        # Desktop binaries
        mv artifacts/ppxai-desktop-linux-amd64/ppxai-desktop artifacts/ppxai-desktop-linux-amd64/ppxai-desktop-linux-amd64
        mv artifacts/ppxai-desktop-macos-arm64/ppxai-desktop artifacts/ppxai-desktop-macos-arm64/ppxai-desktop-macos-arm64
        mv artifacts/ppxai-desktop-windows.exe/ppxai-desktop.exe artifacts/ppxai-desktop-windows.exe/ppxai-desktop-windows.exe

    - name: Find VSIX file
      id: vsix
      run: |
        VSIX_PATH=$(find artifacts -name "*.vsix" -type f | head -1)
        VSIX_NAME=$(basename "$VSIX_PATH")
        echo "path=$VSIX_PATH" >> $GITHUB_OUTPUT
        echo "name=$VSIX_NAME" >> $GITHUB_OUTPUT

    - name: Find Web UI zip
      id: webui
      run: |
        WEBUI_PATH=$(find artifacts -name "ppxai-web-ui-*.zip" -type f | head -1)
        echo "path=$WEBUI_PATH" >> $GITHUB_OUTPUT

    - name: Find DMG
      id: dmg
      run: |
        DMG_PATH=$(find artifacts -name "ppxai-*-macos-arm64.dmg" -type f | head -1)
        echo "path=$DMG_PATH" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/ppxai-linux-amd64/ppxai-linux-amd64
          artifacts/ppxai-macos-arm64/ppxai-macos-arm64
          artifacts/ppxai-windows.exe/ppxai-windows.exe
          artifacts/ppxaide-linux-amd64/ppxaide-linux-amd64
          artifacts/ppxaide-macos-arm64/ppxaide-macos-arm64
          artifacts/ppxaide-windows.exe/ppxaide-windows.exe
          artifacts/ppxai-server-linux-amd64/ppxai-server-linux-amd64
          artifacts/ppxai-server-macos-arm64/ppxai-server-macos-arm64
          artifacts/ppxai-server-windows.exe/ppxai-server-windows.exe
          artifacts/ppxai-desktop-linux-amd64/ppxai-desktop-linux-amd64
          artifacts/ppxai-desktop-macos-arm64/ppxai-desktop-macos-arm64
          artifacts/ppxai-desktop-windows.exe/ppxai-desktop-windows.exe
          ${{ steps.vsix.outputs.path }}
          ${{ steps.webui.outputs.path }}
          ${{ steps.dmg.outputs.path }}
        draft: false
        prerelease: false
        make_latest: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
