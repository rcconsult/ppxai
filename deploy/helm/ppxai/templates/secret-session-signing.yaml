{{- /*
C1 session signing key. HMAC key for the per-user auth cookie that binds every
/s/<slug>/ request to the authenticated identity (see the /authz endpoint in
the session-manager). The session-manager refuses to start without it.

MUST be persistent + stable across restarts — rotating it logs out all active
users. Generate ONCE with `openssl rand -hex 32` and set
auth.sessionSigning.key, OR point auth.sessionSigning.existingSecret at a
pre-created secret (recommended for production, so the key never lives in
values/helm history).

This template is skipped when an existingSecret is supplied.
*/ -}}
{{- if not .Values.auth.sessionSigning.existingSecret }}
{{- if not .Values.auth.sessionSigning.key }}
{{- fail "auth.sessionSigning.key is required (>=32 chars). Generate with `openssl rand -hex 32`, or set auth.sessionSigning.existingSecret. The session-manager fails closed without it." }}
{{- end }}
{{- if lt (len .Values.auth.sessionSigning.key) 32 }}
{{- fail "auth.sessionSigning.key must be >=32 bytes (use `openssl rand -hex 32`)." }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ppxai.fullname" . }}-session-signing
  namespace: {{ include "ppxai.namespace" . }}
  labels:
    {{- include "ppxai.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-signing
type: Opaque
stringData:
  SESSION_SIGNING_KEY: {{ .Values.auth.sessionSigning.key | quote }}
{{- end }}
