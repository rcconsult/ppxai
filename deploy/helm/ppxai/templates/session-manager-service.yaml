---
apiVersion: v1
kind: Service
metadata:
  name: session-manager
  namespace: {{ include "ppxai.namespace" . }}
  labels:
    {{- include "ppxai.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-manager
spec:
  selector:
    app: session-manager
  ports:
    - name: http
      port: 8080
      targetPort: 8080
