{{/*
UNAUTHENTICATED ingress — /api, /login, and the catch-all only. Created by Helm
on first install and left alone thereafter.

C1: per-user /s/{slug} routes do NOT live here. The session-manager creates a
SEPARATE ingress (<ingressName>-auth, via SESSIONS_INGRESS_NAME) at runtime,
carrying the auth-url annotation so every /s/ request is checked against the
signed session cookie by the /authz endpoint. The split is required because
ingress-nginx auth annotations apply to ALL paths in an Ingress — gating
/login here would make login impossible (chicken-and-egg).

On upgrade, Helm skips this resource if it already exists to avoid
field manager conflicts with the session-manager's replace_namespaced_ingress.
*/}}
{{- if not (lookup "networking.k8s.io/v1" "Ingress" (include "ppxai.namespace" .) (include "ppxai.ingressName" .)) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ppxai.ingressName" . }}
  namespace: {{ include "ppxai.namespace" . }}
  labels:
    {{- include "ppxai.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  annotations:
    helm.sh/resource-policy: keep
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    {{- if .Values.ingress.tls.enabled }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Session manager REST API
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: session-manager
                port:
                  number: 8080
          # Login page
          - path: /login(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: login
                port:
                  number: 80
          # Per-user routes are inserted dynamically by session manager.
          # Catch-all — root and unmatched paths serve login page
          - path: /()(.*)?
            pathType: ImplementationSpecific
            backend:
              service:
                name: login
                port:
                  number: 80
{{- end }}
