# ============================================================
# ppxai Helm chart — unified values
# Defaults target colima (single-user dev, no TLS).
# Override with values-microk8s.yaml for corporate deployment.
# ============================================================

# -- Namespace for all resources
namespace: ppxai-system

# -- App prefix for K8s resource naming (configmaps, secrets, ingress, etc.)
appPrefix: ppxai

# -- Override chart name in resource names
nameOverride: ""

# -- Extra labels on the namespace
namespaceLabels:
  environment: development

# ============================================================
# Authentication
# ============================================================
auth:
  # -- stub = username only (no validation), ldap = AD bind
  mode: stub
  ldap:
    url: ""
    baseDn: ""
    bindDn: ""
    # -- Existing secret containing LDAP bind password (key: bindPassword)
    existingSecret: ""
    existingSecretKey: "bindPassword"
    userFilter: "(objectClass=person)"
    usernameAttr: "sAMAccountName"
    cacheTtl: "300"

# ============================================================
# Registry (container image registry)
# ============================================================
registry:
  # -- true = use pre-existing external registry (microk8s addon, etc.)
  #    false = deploy in-chart registry:2 pod
  external: false
  # -- External registry host for Kaniko push (in-cluster DNS)
  externalHost: ""
  # -- External registry port
  externalPort: 5000
  # -- Host used for image pulls by kubelet (may differ from externalHost)
  #    On microk8s: kubelet uses localhost:32000, Kaniko uses in-cluster DNS
  #    Leave empty to use externalHost:externalPort
  pullHost: ""
  # -- In-chart registry port
  port: 5000
  # -- In-chart registry storage size
  storageSize: 1Gi

# ============================================================
# Ingress
# ============================================================
ingress:
  host: ppxai.local
  className: nginx
  # -- Extra annotations (merged with defaults)
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# ============================================================
# Storage
# ============================================================
storageClass:
  # -- Create StorageClass resources (false = reuse pre-existing)
  create: true
  # -- Workspace SC name (Retain policy)
  workspaceName: ppxai-workspace
  workspaceProvisioner: rancher.io/local-path
  # -- Ephemeral SC name (Delete policy)
  ephemeralName: ppxai-ephemeral
  ephemeralProvisioner: rancher.io/local-path

storage:
  workspaceSize: 5Gi
  tempSize: 2Gi
  # -- Override registry PVC storage class (defaults to storageClass.workspaceName)
  registryStorageClass: ""
  registrySize: 1Gi
  # -- Static PV for registry (microk8s hostPath pattern)
  staticPv:
    enabled: false
    hostPath: ""
    size: 5Gi
    storageClassName: ""

# ============================================================
# Session manager
# ============================================================
session:
  maxSessions: 3
  ttlMinutes: 10

# ============================================================
# Images
# ============================================================
image:
  tag: latest
  pullPolicy: Always

# ============================================================
# Kaniko build
# ============================================================
kaniko:
  # -- Host path to ppxai source tree (mounted into Kaniko pod)
  sourcePath: /path/to/ppxai
  serverDockerfile: deploy/images/server/Dockerfile
  sessionManagerDockerfile: deploy/images/session-manager/Dockerfile
  sessionManagerContext: deploy/images/session-manager
  ttlSecondsAfterFinished: 600

# ============================================================
# Resource limits
# ============================================================
resources:
  enabled: false
  sessionManager:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  login:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ============================================================
# Monitoring
# ============================================================
monitoring:
  enabled: false

# ============================================================
# API keys
# ============================================================
apiKeys:
  # -- Create api-keys Secret from values below
  create: true
  # -- Use existing secret instead (when create=false)
  existingSecret: ""
  # -- Key-value pairs: env var name -> value
  keys:
    CUSTOM_API_KEY: ""
    OLLAMA_API_KEY: "dummy"

# ============================================================
# Server config (serialized as ppxai-config.json into ConfigMap)
# ============================================================
serverConfig:
  version: "1.3"
  default_provider: "custom"
  system_prompt: "You are an expert AI coding assistant. Be concise and precise."
  system_prompt_mode: "prepend"
  server:
    idle_timeout: 0
    port: 54320
    working_dir: "/workspace"
    auto_enable_tools: true
    auto_enable_agent: true
  session:
    auto_restore: "never"
  bootstrap:
    files:
      - "AGENTS.md"
    enabled: true
  # -- Providers block — system prompts and model schemas baked in.
  #    URLs use placeholders (YOUR_*) — override per cluster in your own
  #    values file (e.g., values-microk8s.yaml). API keys come from the
  #    Secret named in apiKeys.create / apiKeys.keys.
  providers:
    dgx-spark:
      api_key_env: VLLM_API_KEY
      base_url: http://YOUR_DGX_HOST:8000/v1
      capabilities:
        native_tool_calling: true
        realtime_info: true
        weather: true
        web_fetch: true
        web_search: true
      coding_model: /models/Qwen3.5-122B-A10B-NVFP4
      default_model: /models/Qwen3.5-122B-A10B-NVFP4
      generation_params:
        frequency_penalty: 0
        temperature: 0.2
        top_p: 0.9
      models:
        /models/Qwen3.5-122B-A10B-NVFP4:
          context_limit: 196608
          description: 'MoE: 122B total / 10B active, NVFP4 quantization, 192K context, DGX Spark GB10'
          max_tokens: 8192
          name: Qwen3.5 122B-A10B NVFP4 (MoE)
      name: DGX Spark (Qwen3.5 122B)
      system_prompt: 'You are a helpful AI coding assistant running on DGX Spark. Be concise and direct.


        CRITICAL TOOL RULES:

        1. Call tools directly using native function calling - NEVER output XML like <tool_call>

        2. Read the COMPLETE tool result. If it contains ''FAILED'' or ''Error:'', say ''The operation failed: [error]'' - do NOT claim success

        3. After repeated failure (2+ attempts), STOP and report the error

        4. For apply_patch: use unified diff with ''--- a/path'', ''+++ b/path'', @@ markers, 3+ context lines

        5. For multi-file tasks, read ALL files - not just the first 2

        6. Complete ALL steps in multi-step tasks - do not stop at 3/4'
      tool_calling:
        fallback_on_empty: true
        mode: native
        strip_json_from_text: true
    vllm-gptoss:
      api_key_env: VLLM_API_KEY
      base_url: http://YOUR_GPTOSS_VLLM_SVC/v1
      capabilities:
        native_tool_calling: true
        realtime_info: true
        weather: true
        web_fetch: true
        web_search: true
      coding_model: openai/gpt-oss-120b
      default_model: openai/gpt-oss-120b
      generation_params:
        frequency_penalty: 0.1
        presence_penalty: 0.05
        temperature: 0.2
        top_p: 0.9
      models:
        openai/gpt-oss-120b:
          context_limit: 131072
          description: In-cluster vLLM with LMCache (H100 NVL), native tool calling
          generation_params:
            frequency_penalty: 0.1
            presence_penalty: 0.05
            temperature: 0.2
            top_p: 0.9
          max_tokens: 8192
          name: GPT-OSS 120B
          tool_calling:
            fallback_on_failure: true
      name: vLLM GPT-OSS 120B
      system_prompt: 'You are a helpful AI coding assistant. Be concise and direct.


        CRITICAL TOOL RULES:

        1. NEVER say ''I''ll use the X tool'' - just call the tool directly

        2. Do NOT output tool calls as JSON in your response - use native tool calling

        3. If you need a tool, call it immediately without explanation

        4. Only explain AFTER the tool returns its result

        5. Read the COMPLETE tool result. If it contains ''FAILED'' or ''Error:'', acknowledge the failure - do NOT claim success

        6. When given task order (''start with X''), execute step 1 IMMEDIATELY - do NOT explore first

        7. For multi-file tasks, read ALL files - not just the first 2

        8. Fix-verify: apply_patch → run tests → check result → report. Complete ALL steps'
      tool_calling:
        fallback_on_empty: true
        mode: native
        strip_json_from_text: true
    vllm-qwen35:
      api_key_env: VLLM_API_KEY
      base_url: http://YOUR_QWEN35_VLLM_SVC/v1
      capabilities:
        native_tool_calling: true
        realtime_info: true
        weather: true
        web_fetch: true
        web_search: true
      coding_model: Qwen/Qwen3.5-27B-FP8
      default_model: Qwen/Qwen3.5-27B-FP8
      generation_params:
        frequency_penalty: 0
        temperature: 0.2
        top_p: 0.9
      models:
        Qwen/Qwen3.5-27B-FP8:
          context_limit: 131072
          description: In-cluster vLLM worker (H100 NVL), qwen3_coder tool parser, 128K context
          max_tokens: 8192
          name: Qwen3.5 27B FP8
      name: vLLM Qwen3.5 27B FP8
      system_prompt: 'You are a helpful AI coding assistant. Be concise and direct.


        CRITICAL TOOL RULES:

        1. Call tools directly using native function calling - NEVER output XML like <tool_call>

        2. Read the COMPLETE tool result. If it contains ''FAILED'' or ''Error:'', say ''The operation failed: [error]'' - do NOT claim success

        3. After repeated failure (2+ attempts), STOP and report the error

        4. For apply_patch: use unified diff with ''--- a/path'', ''+++ b/path'', @@ markers, 3+ context lines

        5. For multi-file tasks, read ALL files - not just the first 2

        6. Complete ALL steps in multi-step tasks - do not stop at 3/4'
      tool_calling:
        fallback_on_empty: true
        mode: native
        strip_json_from_text: true
  tools:
    shell:
      timeout: 300
      require_consent: true
    agent:
      max_iterations: 25
      max_tool_iterations: 25
      checkpoint_backend: "none"

# ============================================================
# Benchmark Job/CronJob
# ============================================================
benchmark:
  # -- Enable benchmark Job/CronJob
  enabled: false
  # -- Cron schedule (e.g., "0 6 * * 1" = Monday 6am). Empty = one-shot Job.
  schedule: ""
  # -- Providers to benchmark (each entry: provider + model)
  providers: []
  #   - provider: "vllm-gptoss"
  #     model: "openai/gpt-oss-120b"
  # -- Comma-separated test categories (empty = all)
  categories: ""
  # -- Timeout per test in seconds
  timeout: 120
  # -- Enable debug logging
  debug: false
  # -- AGENTS.md mode: "with", "without", or "both" (delta testing)
  agentsMd: ""
  # -- TTL for completed jobs
  ttlSeconds: 3600
  # -- History limit for CronJob
  historyLimit: 5
  # -- Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ============================================================
# Login page branding
# ============================================================
login:
  title: "ppxai"
  logo: "ppxai"
  tagline: "AI-powered terminal assistant"
  # -- Override button text (auto-set from auth.mode if empty)
  buttonText: ""
