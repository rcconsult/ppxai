# ============================================================
# ppxai Helm chart — unified values
# Defaults target colima (single-user dev, no TLS).
# Override with values-microk8s.yaml for corporate deployment.
# ============================================================

# -- Namespace for all resources
namespace: ppxai-system

# -- App prefix for K8s resource naming (configmaps, secrets, ingress, etc.)
appPrefix: ppxai

# -- Override chart name in resource names
nameOverride: ""

# -- Extra labels on the namespace
namespaceLabels:
  environment: development

# ============================================================
# Authentication
# ============================================================
auth:
  # -- stub = username only (no validation), ldap = AD bind
  mode: stub
  ldap:
    url: ""
    baseDn: ""
    bindDn: ""
    # -- Existing secret containing LDAP bind password (key: bindPassword)
    existingSecret: ""
    existingSecretKey: "bindPassword"
    userFilter: "(objectClass=person)"
    usernameAttr: "sAMAccountName"
    cacheTtl: "300"
  # -- C1: HMAC signing key for the per-user session cookie. The session-manager
  #    binds every /s/<slug>/ request to the authenticated identity via this
  #    cookie + an ingress auth_request to /authz, and FAILS CLOSED without it.
  sessionSigning:
    # -- Signing key (>=32 chars). Generate ONCE with `openssl rand -hex 32` and
    #    keep it stable — rotating logs out all active users. For production,
    #    prefer existingSecret so the key never lands in values/helm history.
    key: ""
    # -- Use a pre-created secret instead (key: SESSION_SIGNING_KEY by default).
    existingSecret: ""
    existingSecretKey: "SESSION_SIGNING_KEY"
    # -- Secure cookie attribute (requires HTTPS). Set false only for local HTTP.
    cookieSecure: true
    # -- /authz also checks the slug still has a live session (immediate
    #    revocation on teardown), behind a short in-process cache.
    requireLiveSession: true

# ============================================================
# Registry (container image registry)
# ============================================================
registry:
  # -- true = use pre-existing external registry (microk8s addon, etc.)
  #    false = deploy in-chart registry:2 pod
  external: false
  # -- External registry host for Kaniko push (in-cluster DNS)
  externalHost: ""
  # -- External registry port
  externalPort: 5000
  # -- Host used for image pulls by kubelet (may differ from externalHost)
  #    On microk8s: kubelet uses localhost:32000, Kaniko uses in-cluster DNS
  #    Leave empty to use externalHost:externalPort
  pullHost: ""
  # -- In-chart registry port
  port: 5000
  # -- In-chart registry storage size
  storageSize: 1Gi

# ============================================================
# Ingress
# ============================================================
ingress:
  host: ppxai.local
  className: nginx
  # -- Extra annotations (merged with defaults)
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# ============================================================
# NetworkPolicy (H2 — egress hardening for per-user server pods)
# ============================================================
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium). Disabled by
# default. When enabled, egress is DENY-by-default + the allowlist below.
# DNS to dnsNamespace is always added automatically.
networkPolicy:
  enabled: false
  # -- Namespace running CoreDNS/kube-dns (selected by name; do NOT use the
  #    kube-dns Service ClusterIP — the CNI enforces the real pod IP).
  dnsNamespace: kube-system
  # -- Additional egress rules (k8s NetworkPolicyEgressRule list). Populate with
  #    your providers' in-cluster namespaces + external CIDRs. Example:
  #    egress:
  #      - to:
  #          - namespaceSelector:
  #              matchLabels:
  #                kubernetes.io/metadata.name: <inference-namespace>
  #      - to:
  #          - ipBlock:
  #              cidr: <provider-cidr>/32
  #        ports:
  #          - protocol: TCP
  #            port: 443
  egress: []
  # -- Ingress isolation (debt (v) — multi-tenant east-west protection). OFF by
  #    default = today's behavior (inbound unrestricted). When enabled, inbound
  #    to the per-user pods is restricted to the ingress controller + the
  #    node/probe source CIDRs. REQUIRED for any real multi-tenant deployment:
  #    without it a neighbour pod can reach another user's engine directly,
  #    bypassing the ingress and its auth.
  ingressIsolation:
    enabled: false
    # -- Namespace of the ingress controller (matched by namespaceSelector).
    ingressNamespace: ingress
    # -- Node/kubelet-probe source CIDR(s) as an ipBlock list. REQUIRED when
    #    enabled — kubelet liveness/readiness probes come from the NODE IP, not a
    #    pod, so a selector can't match them. An EMPTY list while enabled fails
    #    the template render (an empty list silently breaks probes → no endpoints
    #    → 503). Set your node subnet, e.g. ["10.0.0.0/24"].
    probeSourceCIDRs: []
    # -- Pod port the ingress + probes target.
    port: 54320

# ============================================================
# Storage
# ============================================================
storageClass:
  # -- Create StorageClass resources (false = reuse pre-existing)
  create: true
  # -- Workspace SC name (Retain policy)
  workspaceName: ppxai-workspace
  workspaceProvisioner: rancher.io/local-path
  # -- Ephemeral SC name (Delete policy)
  ephemeralName: ppxai-ephemeral
  ephemeralProvisioner: rancher.io/local-path

storage:
  workspaceSize: 5Gi
  tempSize: 2Gi
  # -- Override registry PVC storage class (defaults to storageClass.workspaceName)
  registryStorageClass: ""
  registrySize: 1Gi
  # -- Static PV for registry (microk8s hostPath pattern)
  staticPv:
    enabled: false
    hostPath: ""
    size: 5Gi
    storageClassName: ""

# ============================================================
# Session manager
# ============================================================
session:
  maxSessions: 3
  ttlMinutes: 10

# ============================================================
# Images
# ============================================================
image:
  tag: latest
  pullPolicy: Always

# ============================================================
# Kaniko build
# ============================================================
kaniko:
  # -- Host path to ppxai source tree (mounted into Kaniko pod)
  sourcePath: /path/to/ppxai
  serverDockerfile: deploy/images/server/Dockerfile
  sessionManagerDockerfile: deploy/images/session-manager/Dockerfile
  sessionManagerContext: deploy/images/session-manager
  ttlSecondsAfterFinished: 600

# ============================================================
# Resource limits
# ============================================================
resources:
  enabled: false
  sessionManager:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  login:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ============================================================
# Monitoring
# ============================================================
monitoring:
  enabled: false

# ============================================================
# API keys
# ============================================================
apiKeys:
  # -- Create api-keys Secret from values below
  create: true
  # -- Use existing secret instead (when create=false)
  existingSecret: ""
  # -- Key-value pairs: env var name -> value
  keys:
    CUSTOM_API_KEY: ""
    OLLAMA_API_KEY: "dummy"

# ============================================================
# Server config (serialized as ppxai-config.json into ConfigMap)
# ============================================================
serverConfig:
  version: "1.3"
  default_provider: "custom"
  system_prompt: "You are an expert AI coding assistant. Be concise and precise."
  system_prompt_mode: "prepend"
  server:
    idle_timeout: 0
    port: 54320
    working_dir: "/workspace"
    auto_enable_tools: true
    auto_enable_agent: true
  session:
    auto_restore: "never"
  bootstrap:
    files:
      - "AGENTS.md"
    enabled: true
  # -- Providers block. Override entirely per environment. The chart
  #    deliberately ships an EMPTY providers map — the previous
  #    placeholder examples (URLs starting with YOUR_*) leaked into
  #    every deployment via Helm's deep-merge and showed up as
  #    real (broken) providers in the rendered ConfigMap.
  #    Each environment must define its own providers in its own
  #    values file (see values-microk8s.yaml or values-colima.yaml).
  providers: {}
  tools:
    shell:
      timeout: 300
      require_consent: true
      # -- Launch the web terminal as a login shell (sources /etc/profile +
      #    ~/.bash_profile / ~/.profile). With a persistent HOME on the
      #    workspace PVC, user shell customization survives pod restarts.
      login_shell: true
      # -- Pin the terminal shell binary (else falls back to $SHELL or /bin/sh).
      shell_bin: "/bin/bash"
    agent:
      max_iterations: 25
      max_tool_iterations: 25
      checkpoint_backend: "none"

# ============================================================
# Benchmark Job/CronJob
# ============================================================
benchmark:
  # -- Enable benchmark Job/CronJob
  enabled: false
  # -- Cron schedule (e.g., "0 6 * * 1" = Monday 6am). Empty = one-shot Job.
  schedule: ""
  # -- Providers to benchmark (each entry: provider + model)
  providers: []
  #   - provider: "vllm-gptoss"
  #     model: "openai/gpt-oss-120b"
  # -- Comma-separated test categories (empty = all)
  categories: ""
  # -- Timeout per test in seconds
  timeout: 120
  # -- Enable debug logging
  debug: false
  # -- AGENTS.md mode: "with", "without", or "both" (delta testing)
  agentsMd: ""
  # -- TTL for completed jobs
  ttlSeconds: 3600
  # -- History limit for CronJob
  historyLimit: 5
  # -- Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ============================================================
# Login page branding
# ============================================================
login:
  title: "ppxai"
  logo: "ppxai"
  tagline: "AI-powered terminal assistant"
  # -- Override button text (auto-set from auth.mode if empty)
  buttonText: ""
