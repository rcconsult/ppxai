# docker-compose.yaml for ppxai-server local development
#
# Usage:
#   cd <repo-root>
#   docker compose -f deploy/compose/docker-compose.yaml up        # Start server
#   docker compose -f deploy/compose/docker-compose.yaml up -d     # Start in background
#   docker compose -f deploy/compose/docker-compose.yaml down      # Stop and remove
#   docker compose -f deploy/compose/docker-compose.yaml logs -f   # Follow logs
#
# Environment:
#   Copy .env.example to .env and add your API keys

services:
  ppxai-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: ppxai-server
    ports:
      - "54320:54320"
    env_file:
      - ../../.env
    environment:
      # Override default settings via environment
      - PPXAI_LOG_LEVEL=${PPXAI_LOG_LEVEL:-INFO}
    volumes:
      # Persist sessions and data
      - ppxai-data:/home/ppxai/.ppxai
      # Mount config file (optional, for custom provider configs)
      # - ./ppxai-config.json:/home/ppxai/.ppxai/ppxai-config.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:54320/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  ppxai-data:
    driver: local
