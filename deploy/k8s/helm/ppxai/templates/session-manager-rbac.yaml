---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: session-manager
  namespace: ppxai-system
  labels:
    app.kubernetes.io/name: ppxai
    app.kubernetes.io/component: session-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ppxai-session-manager
  labels:
    app.kubernetes.io/name: ppxai
    app.kubernetes.io/component: session-manager
rules:
  # Pods
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  # Services
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, create, delete]
  # PVCs
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, delete]
  # Ingress (create sessions ingress + patch per-user routes)
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, create, update, patch, delete]
  # ConfigMaps and Secrets (read-only — for serving config to pods)
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ppxai-session-manager
  labels:
    app.kubernetes.io/name: ppxai
    app.kubernetes.io/component: session-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ppxai-session-manager
subjects:
  - kind: ServiceAccount
    name: session-manager
    namespace: ppxai-system
