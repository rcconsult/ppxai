---
apiVersion: batch/v1
kind: Job
metadata:
  name: build-ppxai-session-manager
  namespace: ppxai-system
  labels:
    app.kubernetes.io/name: ppxai
    app.kubernetes.io/component: build
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-registry
          image: busybox
          command: ['sh', '-c', 'until nc -z registry 5000; do echo "waiting for registry..."; sleep 3; done']
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --dockerfile=/workspace/deploy/k8s/session-manager/Dockerfile
            - --context=dir:///workspace/deploy/k8s/session-manager
            - --destination=registry.ppxai-system.svc:5000/ppxai-session-manager:latest
            - --insecure
            - --skip-tls-verify
            - --cache=false
          volumeMounts:
            - name: source
              mountPath: /workspace
      volumes:
        - name: source
          hostPath:
            path: /Users/rado/git/utils/ppxai
            type: Directory
