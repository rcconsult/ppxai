# Base Ingress for ppxai.local
# The session manager dynamically patches this Ingress to add/remove
# per-user routes (/s/<username>) as sessions are created and deleted.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ppxai-ingress
  namespace: ppxai-system
  labels:
    app.kubernetes.io/name: ppxai
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # SSE: disable buffering so streaming responses reach the browser immediately
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Session manager REST API (no rewrite — path is already correct)
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: session-manager
                port:
                  number: 8080
          # Login page — served by the login nginx pod (static HTML + JS).
          - path: /login(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: login
                port:
                  number: 80
          # Per-user server routes are inserted here dynamically by session manager.
          # Example (auto-managed, do not edit manually):
          #   - path: /s/alice(/|$)(.*)
          #     pathType: ImplementationSpecific
          #     backend:
          #       service:
          #         name: ppxai-svc-alice
          #         port:
          #           number: 54320
