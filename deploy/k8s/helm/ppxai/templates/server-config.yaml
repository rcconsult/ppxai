# ppxai-server-config ConfigMap — mounted into every server pod at
# /root/.ppxai/ppxai-config.json
# API keys come from the ppxai-api-keys Secret (env vars); this file
# holds only structural provider/model configuration.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ppxai-server-config
  namespace: ppxai-system
  labels:
    app.kubernetes.io/name: ppxai
    app.kubernetes.io/component: server-config
data:
  ppxai-config.json: |
    {
      "version": "1.3",
      "default_provider": "perplexity",
      "system_prompt": "You are an expert AI coding assistant. Be concise and precise. When using tools, execute them directly and report results briefly. Focus on code quality, correctness, and best practices.",
      "system_prompt_mode": "prepend",
      "server": {
        "idle_timeout": 0,
        "port": 54320
      },
      "session": {
        "auto_restore": "never"
      },
      "bootstrap": {
        "files": ["AGENTS.md", "CLAUDE.md", "INSTRUCTIONS.md"],
        "enabled": true
      },
      "providers": {
        "perplexity": {
          "name": "Perplexity AI",
          "base_url": "https://api.perplexity.ai",
          "api_key_env": "PERPLEXITY_API_KEY",
          "default_model": "sonar-pro",
          "generation_params": {
            "temperature": 0.2,
            "top_p": 0.9,
            "frequency_penalty": 0.15
          },
          "models": {
            "sonar": {
              "name": "Sonar",
              "description": "Lightweight search model with real-time grounding"
            },
            "sonar-pro": {
              "name": "Sonar Pro",
              "description": "Advanced search model for complex queries",
              "context_limit": 200000
            },
            "sonar-reasoning-pro": {
              "name": "Sonar Reasoning Pro",
              "description": "Precision reasoning with Chain of Thought (DeepSeek-R1)"
            }
          },
          "capabilities": {
            "web_search": true,
            "web_fetch": true,
            "native_tool_calling": false
          }
        },
        "gemini": {
          "name": "Google Gemini",
          "base_url": "https://generativelanguage.googleapis.com/v1beta/openai",
          "api_key_env": "GEMINI_API_KEY",
          "default_model": "gemini-2.5-flash",
          "options": {
            "enable_grounding": true,
            "native_tool_calling": true
          },
          "generation_params": {
            "temperature": 0.2,
            "top_p": 0.9
          },
          "models": {
            "gemini-2.5-flash": {
              "name": "Gemini 2.5 Flash",
              "description": "Fast model, best price/performance",
              "context_limit": 1000000
            },
            "gemini-2.5-pro": {
              "name": "Gemini 2.5 Pro",
              "description": "Most capable for complex reasoning",
              "context_limit": 1000000
            },
            "gemini-2.0-flash": {
              "name": "Gemini 2.0 Flash",
              "description": "Fast model with multimodal support",
              "context_limit": 1000000
            }
          },
          "capabilities": {
            "web_search": true,
            "web_fetch": true,
            "native_tool_calling": true
          }
        },
        "openai": {
          "name": "OpenAI",
          "base_url": "https://api.openai.com/v1",
          "api_key_env": "OPENAI_API_KEY",
          "default_model": "gpt-4.1-mini",
          "generation_params": {
            "temperature": 0.2,
            "top_p": 0.95
          },
          "models": {
            "gpt-4.1-mini": {
              "name": "GPT-4.1 Mini",
              "description": "Budget option with 1M context",
              "context_limit": 1047576
            },
            "gpt-4.1": {
              "name": "GPT-4.1",
              "description": "Flagship with 1M context",
              "context_limit": 1047576
            },
            "gpt-4o": {
              "name": "GPT-4o",
              "description": "Multimodal model"
            },
            "o4-mini": {
              "name": "o4 Mini",
              "description": "Latest reasoning model with improved tool use",
              "context_limit": 200000,
              "generation_params": {
                "temperature": 1.0,
                "max_tokens": 8192
              }
            }
          },
          "capabilities": {
            "web_search": false,
            "web_fetch": false,
            "native_tool_calling": true
          }
        }
      },
      "tools": {
        "shell": {
          "timeout": 300,
          "require_consent": true
        },
        "agent": {
          "max_iterations": 25,
          "max_tool_iterations": 25,
          "checkpoint_backend": "none"
        }
      }
    }
---
# ppxai-api-keys Secret — holds provider API keys.
# Override with: helm upgrade ppxai . --set apiKeys.perplexityApiKey=pplx-...
apiVersion: v1
kind: Secret
metadata:
  name: ppxai-api-keys
  namespace: ppxai-system
  labels:
    app.kubernetes.io/name: ppxai
    app.kubernetes.io/component: api-keys
type: Opaque
stringData:
  PERPLEXITY_API_KEY: {{ .Values.apiKeys.perplexityApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.apiKeys.openaiApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.apiKeys.geminiApiKey | quote }}
  CUSTOM_API_KEY: {{ .Values.apiKeys.customApiKey | quote }}
  CUSTOM_BASE_URL: {{ .Values.apiKeys.customBaseUrl | quote }}
