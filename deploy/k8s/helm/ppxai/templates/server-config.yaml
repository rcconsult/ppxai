# ppxai-server-config ConfigMap — mounted into every server pod at
# /root/.ppxai/ppxai-config.json
# Coder service: internal LLM providers only (GPT-OSS + DGX Spark).
# API keys come from the ppxai-api-keys Secret (env vars).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ppxai-server-config
  namespace: ppxai-system
  labels:
    app.kubernetes.io/name: ppxai
    app.kubernetes.io/component: server-config
data:
  ppxai-config.json: |
    {
      "version": "1.3",
      "default_provider": "custom",
      "system_prompt": "You are an expert AI coding assistant. Be concise and precise. When using tools, execute them directly and report results briefly. Focus on code quality, correctness, and best practices.",
      "system_prompt_mode": "prepend",
      "server": {
        "idle_timeout": 0,
        "port": 54320
      },
      "session": {
        "auto_restore": "never"
      },
      "bootstrap": {
        "files": ["AGENTS.md"],
        "enabled": true
      },
      "providers": {
        "custom": {
          "name": "Internal Code AI (GPT-OSS)",
          "base_url": "https://codeai.trad.int/v1",
          "api_key_env": "CUSTOM_API_KEY",
          "default_model": "openai/gpt-oss-120b",
          "coding_model": "openai/gpt-oss-120b",
          "system_prompt": "You are a helpful AI coding assistant. Be concise and direct.\n\nCRITICAL TOOL RULES:\n1. NEVER say 'I'll use the X tool' and then output JSON - just call the tool directly\n2. Do NOT output tool calls as JSON in your response - use native tool calling\n3. If you need a tool, call it immediately without explanation\n4. Only explain AFTER the tool returns its result\n5. Prefer read_file over cat/type commands\n6. Use replace_block/insert_text/apply_patch for editing",
          "generation_params": {
            "temperature": 0.2,
            "top_p": 0.9,
            "frequency_penalty": 0.1,
            "presence_penalty": 0.05
          },
          "tool_calling": {
            "mode": "native",
            "fallback_on_empty": true,
            "strip_json_from_text": true
          },
          "models": {
            "openai/gpt-oss-120b": {
              "name": "GPT OSS 120B",
              "description": "Internal self-hosted GPT model with native tool calling via vLLM",
              "context_limit": 131072,
              "max_tokens": 8192,
              "tool_calling": { "fallback_on_failure": true }
            }
          },
          "pricing": {
            "openai/gpt-oss-120b": { "input": 0.0, "output": 0.0 }
          },
          "capabilities": {
            "web_search": true,
            "web_fetch": true,
            "native_tool_calling": true
          }
        },
        "asusai-vllm": {
          "name": "DGX Spark vLLM (GB10)",
          "base_url": "http://llmprod.trad.int:8000/v1",
          "api_key_env": "OLLAMA_API_KEY",
          "default_model": "Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8",
          "coding_model": "Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8",
          "system_prompt": "You are an expert coding assistant running on a local NVIDIA GB10 GPU via vLLM. Be concise and precise. When using tools, execute them directly and report results briefly.",
          "generation_params": {
            "temperature": 0.2,
            "top_p": 0.9,
            "frequency_penalty": 0.0
          },
          "tool_calling": {
            "mode": "native",
            "fallback_on_empty": true,
            "strip_json_from_text": true
          },
          "models": {
            "Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8": {
              "name": "Qwen3 Coder 30B-A3B FP8 (MoE)",
              "description": "Code-specialized MoE: 30.5B total / 3.3B active, FP8, native tool calling",
              "context_limit": 131072,
              "max_tokens": 8192
            },
            "Qwen/Qwen3-Coder-Next-FP8": {
              "name": "Qwen3-Coder-Next FP8 (Hybrid MoE)",
              "description": "Code-specialized hybrid MoE: 80B total / 3B active, FP8, 256K context",
              "context_limit": 131072,
              "max_tokens": 8192
            },
            "Qwen/Qwen2.5-Coder-32B-Instruct": {
              "name": "Qwen2.5 Coder 32B (Dense)",
              "description": "Dense 32B coding model, all 32B active per token",
              "context_limit": 32768,
              "max_tokens": 8192
            }
          },
          "pricing": {
            "Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8": { "input": 0.0, "output": 0.0 },
            "Qwen/Qwen3-Coder-Next-FP8": { "input": 0.0, "output": 0.0 },
            "Qwen/Qwen2.5-Coder-32B-Instruct": { "input": 0.0, "output": 0.0 }
          },
          "capabilities": {
            "web_search": true,
            "web_fetch": true,
            "native_tool_calling": true
          }
        }
      },
      "tools": {
        "shell": {
          "timeout": 300,
          "require_consent": true
        },
        "agent": {
          "max_iterations": 25,
          "max_tool_iterations": 25,
          "checkpoint_backend": "none"
        }
      }
    }
---
# ppxai-api-keys Secret — holds provider API keys.
# Override with: helm upgrade ppxai . --set apiKeys.customApiKey=...
apiVersion: v1
kind: Secret
metadata:
  name: ppxai-api-keys
  namespace: ppxai-system
  labels:
    app.kubernetes.io/name: ppxai
    app.kubernetes.io/component: api-keys
type: Opaque
stringData:
  CUSTOM_API_KEY: {{ .Values.apiKeys.customApiKey | quote }}
  OLLAMA_API_KEY: {{ .Values.apiKeys.ollamaApiKey | default "dummy" | quote }}
