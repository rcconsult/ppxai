---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-manager
  namespace: ppxai-system
  labels:
    app.kubernetes.io/name: ppxai
    app.kubernetes.io/component: session-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session-manager
  template:
    metadata:
      labels:
        app: session-manager
    spec:
      serviceAccountName: session-manager
      containers:
        - name: session-manager
          image: {{ .Values.image.sessionManager }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: NAMESPACE
              value: ppxai-system
            - name: REGISTRY_DIR
              value: /registry
            - name: MAX_SESSIONS
              value: {{ .Values.session.maxSessions | quote }}
            - name: TTL_MINUTES
              value: {{ .Values.session.ttlMinutes | quote }}
            - name: SERVER_IMAGE
              value: {{ .Values.image.server }}:{{ .Values.image.tag }}
            - name: WORKSPACE_SIZE
              value: {{ .Values.storage.workspaceSize | quote }}
            - name: TEMP_SIZE
              value: {{ .Values.storage.tempSize | quote }}
            - name: INGRESS_NAME
              value: ppxai-sessions-ingress
            - name: INGRESS_HOST
              value: {{ .Values.ingress.host }}
          volumeMounts:
            - name: registry
              mountPath: /registry
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: registry
          persistentVolumeClaim:
            claimName: ppxai-registry
