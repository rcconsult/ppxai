# Kaniko build job for coder-session-manager image.
# Uses the microk8s built-in registry (container-registry namespace).
#
# Usage:
#   microk8s kubectl delete job build-coder-session-manager -n coder --ignore-not-found
#   microk8s kubectl apply -f deploy/microk8s/kaniko-session-manager-job.yaml
#   microk8s kubectl logs -f job/build-coder-session-manager -n coder
---
apiVersion: batch/v1
kind: Job
metadata:
  name: build-coder-session-manager
  namespace: coder
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/component: build
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-registry
          image: busybox
          command: ['sh', '-c', 'until nc -z registry.container-registry.svc.cluster.local 5000; do echo "waiting for registry..."; sleep 3; done']
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --dockerfile=/workspace/deploy/images/session-manager/Dockerfile
            - --context=dir:///workspace/deploy/images/session-manager
            - --destination=registry.container-registry.svc.cluster.local:5000/coder-session-manager:latest
            - --insecure
            - --skip-tls-verify
            - --cache=false
          volumeMounts:
            - name: source
              mountPath: /workspace
      volumes:
        - name: source
          hostPath:
            path: /path/to/ppxai
            type: Directory
