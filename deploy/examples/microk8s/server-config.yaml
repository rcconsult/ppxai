      "server": {
        "auto_enable_agent": true,
        "auto_enable_tools": true,
        "idle_timeout": 0,
        "port": 54320,
        "working_dir": "/workspace"
      },
      "session": {
        "auto_restore": "never"
      },
      "system_prompt": "You are an expert AI coding assistant. Be concise and precise. When using tools, execute them directly and report results briefly. Focus on code quality, correctness, and best practices.",
      "system_prompt_mode": "prepend",
      "tools": {
        "agent": {
          "checkpoint_backend": "none",
          "max_iterations": 50,
          "max_tool_iterations": 50,
          "zombie_threshold": 6
        },
        "shell": {
          "require_consent": true,
          "timeout": 300,
          "login_shell": true,
          "shell_bin": "/bin/bash"
        },
        "vision_model": {
          "api_key_env": "VLLM_API_KEY",
          "auto_caption": true,
          "enabled": true,
          "endpoint": "http://vllm-qwen3-vl-8b-fp8-lmcache-mig.vllm.svc.cluster.local/v1",
          "max_tokens": 200,
          "model": "Qwen/Qwen3-VL-8B-Instruct",
          "timeout": 30
        },
        "web_search": {
          "perplexity_model": "perplexity/sonar"
        }
      },
      "version": "1.3",
      "file_tree": {
        "ignore_dirs": [
          ".git",
          "node_modules",
          "__pycache__",
          ".tox",
          "dist",
          "build",
          ".eggs",
          ".mypy_cache"
        ]
      },
      "network": {
        "ssl": {
          "verify": true,
          "cert_file": ""
        }
      },
      "execution": {
        "run": {
          "grounding": false,
          "web_search": false
        },
        "collect": "yes",
        "egress_ceiling": [
          "api.perplexity.ai"
        ],
        "task": {
          "enabled": true,
          "default_grant": {
            "tools": [
              "web_search"
            ]
          },
          "allow_user_default": true,
          "sandbox": {
            "enforcement": "in_process",
            "workdir": {
              "root": "~/.ppxai/runs",
              "writable": true,
              "cleanup": "keep"
            },
            "read_paths": {
              "allow": [
                "/workspace"
              ],
              "deny": [
                ".env",
                ".git",
                ".ssh",
                "secrets",
                "node_modules"
              ],
              "follow_symlinks": false
            },
            "skills_dir": null,
            "specs_dir": null,
            "allow_skill_scripts": false
          }
        },
