# Login page — static HTML form served by nginx.
# ConfigMap (HTML) + Deployment + Service.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: login-page
  namespace: coder
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/component: login
binaryData:
  # Multi-resolution ICO (mirror of ppxai/web/favicon.ico). nginx
  # serves it at / since the login service is the catch-all for
  # coder.example.com — every page on the domain shares this favicon.
  favicon.ico: 
data:
  nginx.conf: |
    worker_processes 2;
    error_log /var/log/nginx/error.log notice;
    pid /run/nginx.pid;
    events { worker_connections 128; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;
      server {
        listen 80;
        server_name _;
        location / {
          root /usr/share/nginx/html;
          index index.html;
        }
      }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>coder — Sign In</title>
      <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any">
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
          background: #0f1117;
          color: #e2e8f0;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .card {
          background: #1a1d27;
          border: 1px solid #2d3148;
          border-radius: 12px;
          padding: 2.5rem 2rem;
          width: 100%;
          max-width: 360px;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .logo {
          font-size: 1.5rem;
          font-weight: 700;
          letter-spacing: -0.5px;
          color: #818cf8;
          margin-bottom: 0.25rem;
        }

        .tagline {
          font-size: 0.82rem;
          color: #64748b;
          margin-bottom: 2rem;
        }

        label {
          display: block;
          font-size: 0.8rem;
          font-weight: 500;
          color: #94a3b8;
          margin-bottom: 0.4rem;
          letter-spacing: 0.03em;
          text-transform: uppercase;
        }

        input[type="text"], input[type="password"] {
          width: 100%;
          padding: 0.65rem 0.9rem;
          background: #0f1117;
          border: 1px solid #2d3148;
          border-radius: 7px;
          color: #e2e8f0;
          font-size: 0.95rem;
          outline: none;
          transition: border-color 0.15s;
          margin-bottom: 1.25rem;
        }

        input[type="text"]:focus, input[type="password"]:focus {
          border-color: #818cf8;
        }

        input[type="text"]::placeholder, input[type="password"]::placeholder {
          color: #3d4263;
        }

        button {
          width: 100%;
          padding: 0.7rem;
          background: #4f46e5;
          color: #fff;
          border: none;
          border-radius: 7px;
          font-size: 0.95rem;
          font-weight: 600;
          cursor: pointer;
          transition: background 0.15s, opacity 0.15s;
        }

        button:hover:not(:disabled) {
          background: #4338ca;
        }

        button:disabled {
          opacity: 0.55;
          cursor: not-allowed;
        }

        .status {
          margin-top: 1rem;
          padding: 0.65rem 0.9rem;
          border-radius: 7px;
          font-size: 0.85rem;
          display: none;
        }

        .status.error {
          background: #2d1515;
          border: 1px solid #7f1d1d;
          color: #fca5a5;
          display: block;
        }

        .status.info {
          background: #1a2240;
          border: 1px solid #1e3a8a;
          color: #93c5fd;
          display: block;
        }

        .spinner {
          display: inline-block;
          width: 14px;
          height: 14px;
          border: 2px solid rgba(255,255,255,0.3);
          border-top-color: #fff;
          border-radius: 50%;
          animation: spin 0.7s linear infinite;
          vertical-align: middle;
          margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="logo">coder</div>
        <div class="tagline">AI-powered coding assistant</div>

        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          placeholder="your-name"
          maxlength="32"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="AD password"
          autocomplete="current-password"
        />

        <button id="btn" onclick="startSession()">Sign In</button>
        <div class="status" id="status"></div>
      </div>

      <script>
        document.querySelectorAll('#username, #password').forEach(function(el) {
          el.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') startSession();
          });
        });

        document.getElementById('username').focus();

        async function startSession() {
          const btn = document.getElementById('btn');
          const status = document.getElementById('status');
          const username = document.getElementById('username').value.trim();
          const password = document.getElementById('password').value;

          if (!username) {
            showError('Please enter a username.');
            return;
          }

          if (!password) {
            showError('Please enter your password.');
            return;
          }

          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span>Signing in\u2026';
          status.className = 'status';
          status.style.display = 'none';

          try {
            const res = await fetch('/api/sessions', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, password })
            });

            if (res.status === 201 || res.status === 200) {
              const data = await res.json();
              showInfo('Session starting \u2014 waiting for route\u2026');
              await waitForRoute(data.path);
              showInfo('Session ready \u2014 redirecting\u2026');
              window.location.href = data.path;
              return;
            }

            if (res.status === 401) {
              showError('Invalid username or password.');
            } else if (res.status === 503) {
              showError('All sessions are in use. Please try again in a few minutes.');
            } else if (res.status === 400) {
              const data = await res.json().catch(() => ({}));
              showError(data.detail || 'Invalid username. Use letters, digits, dots, hyphens, or underscores.');
            } else {
              showError('Unexpected error (' + res.status + '). Please try again.');
            }
          } catch (err) {
            showError('Could not reach the server. Check your connection and try again.');
          }

          btn.disabled = false;
          btn.textContent = 'Sign In';
        }

        async function waitForRoute(path) {
          const maxAttempts = 20;
          const delay = 500;
          for (let i = 0; i < maxAttempts; i++) {
            try {
              const r = await fetch(path + 'health', { method: 'GET', credentials: 'same-origin' });
              if (r.ok) return;
            } catch (e) { /* route not ready yet */ }
            await new Promise(resolve => setTimeout(resolve, delay));
          }
        }

        function showError(msg) {
          const el = document.getElementById('status');
          el.className = 'status error';
          el.textContent = msg;
        }

        function showInfo(msg) {
          const el = document.getElementById('status');
          el.className = 'status info';
          el.textContent = msg;
        }
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  namespace: coder
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/component: login
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: login-page
            items:
              - key: index.html
                path: index.html
              - key: favicon.ico
                path: favicon.ico
        - name: nginx-conf
          configMap:
            name: login-page
            items:
              - key: nginx.conf
                path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: login
  namespace: coder
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/component: login
spec:
  selector:
    app: login
  ports:
    - name: http
      port: 80
      targetPort: 80
