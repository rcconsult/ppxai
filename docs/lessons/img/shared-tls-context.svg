<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#1f2937">Outbound HTTPS: which trust store does the client use?</text>
  <text x="30" y="64" font-size="14" fill="#4b5563">Same code, two networks. Only the shared context validates on both.</text>
  <!-- column headers -->
  <text x="560" y="104" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Office network</text>
  <text x="560" y="122" font-size="12" fill="#6b7280" text-anchor="middle">TLS-inspecting proxy, corporate CA in OS store</text>
  <text x="780" y="104" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Direct connection</text>
  <text x="780" y="122" font-size="12" fill="#6b7280" text-anchor="middle">real public certificates</text>
  <!-- row 1 -->
  <rect x="30" y="140" width="840" height="78" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="50" y="170" font-size="15" font-weight="bold" fill="#1f2937">httpx default: verify=True</text>
  <text x="50" y="192" font-size="13" fill="#4b5563">trusts the certifi bundle only</text>
  <circle cx="560" cy="179" r="16" fill="#dc2626"/><path d="M554,173 L566,185 M566,173 L554,185" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <text x="560" y="210" font-size="11" fill="#991b1b" text-anchor="middle">CERTIFICATE_VERIFY_FAILED</text>
  <circle cx="780" cy="179" r="16" fill="#16a34a"/><path d="M773,179 L778,184 L787,173" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- row 2 -->
  <rect x="30" y="230" width="840" height="78" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="50" y="260" font-size="15" font-weight="bold" fill="#1f2937">a CA path: verify="corp.pem", cafile=</text>
  <text x="50" y="282" font-size="13" fill="#4b5563">the file REPLACES the system roots</text>
  <circle cx="560" cy="269" r="16" fill="#16a34a"/><path d="M553,269 L558,274 L567,263" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="780" cy="269" r="16" fill="#dc2626"/><path d="M774,263 L786,275 M786,263 L774,275" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <text x="780" y="300" font-size="11" fill="#991b1b" text-anchor="middle">CERTIFICATE_VERIFY_FAILED</text>
  <!-- row 3 -->
  <rect x="30" y="320" width="840" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="50" y="350" font-size="15" font-weight="bold" fill="#1f2937">verify=tls_verify() / context=tls_ssl_context()</text>
  <text x="50" y="372" font-size="13" fill="#4b5563">OS store PLUS the configured CA · cached, built once · ppxai/config/tls.py</text>
  <circle cx="560" cy="359" r="16" fill="#16a34a"/><path d="M553,359 L558,364 L567,353" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="780" cy="359" r="16" fill="#16a34a"/><path d="M773,359 L778,364 L787,353" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="30" y="420" font-size="11" fill="#6b7280">docs/lessons/outbound-http-clients-take-the-shared-tls-context.md</text>
</svg>
