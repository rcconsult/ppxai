[project]
name = "ppxai"
version = "1.19.1"
description = "Terminal UI for interacting with multiple AI providers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "ppxai contributors" }
]
keywords = ["ai", "llm", "perplexity", "openai", "terminal", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.0.0",
    "httpx>=0.24.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "pyperclip>=1.8.0",
    "filetype>=1.2.0", # Pure Python file type detection (replaces python-magic)
    "tree-sitter>=0.23",
    # Tree-sitter language packages for syntax highlighting (all 15 supported languages)
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-json>=0.24.8",
    "tree-sitter-yaml>=0.7.2",
    "tree-sitter-toml>=0.7.0",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-css>=0.25.0",
    "tree-sitter-markdown>=0.5.1",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-sql>=0.3.0",
    "tree-sitter-xml>=0.7.0",
    "tree-sitter-regex>=0.25.0",
    "blinker>=1.9.0",
]

[project.optional-dependencies]
# Server dependencies for HTTP + SSE (v1.9.0)
server = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sse-starlette>=1.6.0",
    # v1.18.7: required by /files/upload (FastAPI's UploadFile / Form
    # raises RuntimeError at import time without this). Was a
    # transitive dep of fastapi[standard] in local dev but not in the
    # slim Dockerfile pip install of ".[server,search,data]".
    "python-multipart>=0.0.6",
]

# MCP tool support
mcp = [
    "mcp>=0.1.0",
]

# Web search tool (DuckDuckGo)
search = [
    "ddgs>=9.0.0",
]

# Native Gemini provider (v1.12.5+)
# CEILING-PINNED — SDK 1.57.0 regressed code editing to 0% (KI-001); no
# upstream issue tracks it. Every ceiling raise goes through the benchmark
# gate in docs/known-issues.md.
gemini = [
    "google-genai>=1.0.0,<3.0.0",
]

# Data processing support (v1.13.8 yaml/hcl, v1.17.4 multimodal file upload)
# Groups two related but distinct capabilities under one extras name so
# `pip install 'ppxai[data]'` gives users everything needed for file-based
# workflows: YAML/HCL parsing for config tooling, pypdf/pypdfium2 for PDF
# attachment extraction (ReadPdfTool, GetPdfPageImageTool), and the
# future Excel/PPTX dependencies added in Phase 4.
data = [
    "pyyaml>=6.0",
    "python-hcl2>=4.3",
    # v1.17.4 Phase 2.9 — PDF attachment support
    "pypdf>=4.0",        # Text extraction for ReadPdfTool
    # v1.18.1: replaced pdf2image+poppler with pypdfium2 — pure-wheel
    # bindings to Google's PDFium. Bundled via uv venv, no system
    # binary required, so PyInstaller binaries are self-contained on
    # all platforms. Used for both GetPdfPageImageTool (PDF→PNG) and
    # the SummarizePptxVisualTool slide rasterizer (replaces a
    # `pdftoppm` subprocess call).
    "pypdfium2>=4.30",
    # v1.17.4 Phase 4.3 — Excel + PowerPoint attachment support
    "openpyxl>=3.1",    # Excel read for ListExcelSheetsTool, ReadExcelSheetTool
    "python-pptx>=1.0", # PowerPoint read for ListPptxSlidesTool, ReadPptxSlideTextTool
    # matplotlib deferred — only needed for RenderExcelChartTool (Phase 4 follow-up)
]

# Next-gen TUI with Textual (v1.15.0+)
tui = [
    "textual>=0.47.0",
    "textual-image>=0.8.0",
    "blinker>=1.7.0",  # Event bus for decoupled component communication
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

# Build dependencies
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
ppxai = "ppxai.rich.main:main"
ppxai-server = "ppxai.server.http:run_server"
ppxai-desktop = "ppxai.server.http:run_desktop"
ppxaide = "ppxai.tui:main"

[project.urls]
Homepage = "https://github.com/rcconsult/ppxai"
Repository = "https://github.com/rcconsult/ppxai"
Documentation = "https://github.com/rcconsult/ppxai#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ppxai"]

[dependency-groups]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    # Linting
    "ruff>=0.1.0",
    # Build tools
    "pyinstaller>=6.0.0",
    # Server (for local dev)
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sse-starlette>=1.6.0",
    # Gemini native SDK — ceiling-pinned via the KI-001 benchmark gate
    # (docs/known-issues.md); keep in sync with the `gemini` extra above.
    "google-genai>=1.0.0,<3.0.0",
    # Web search (ddgs - renamed from duckduckgo-search)
    "ddgs>=9.0.0",
    # Interactive shell
    "ipython>=8.37.0",
    # Next-gen TUI (v1.15.0+)
    "textual>=0.47.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Model OUTPUT captured by the tool-calling eval, not source. `test_cases.py`
# prompts a model to write to a fictional `/src/` path and the file-write tool
# saves whatever comes back — `functions.py` is the model echoing the prompt's
# `def function_{i}():` template verbatim, placeholder and all, and is the one
# file here that does not parse. The other four are syntactically valid model
# output that nothing imports. Committed as source by a bulk "adding files to
# clean state", while the sibling `debug/` output is correctly gitignored as
# regenerable. Excluded because a directory of model transcripts does not
# belong under a linter, not because the code is broken.
extend-exclude = ["benchmarks/llm-eval/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Exclude integration tests by default (they modify global config state)
# Run them explicitly with: pytest tests/test_custom_endpoint_integration.py -v
addopts = "--ignore=tests/test_custom_endpoint_integration.py"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests that spawn subprocesses or otherwise take seconds (deselect with '-m \"not slow\"')",
]
