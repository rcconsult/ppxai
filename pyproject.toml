[project]
name = "ppxai"
version = "1.16.0"
description = "Terminal UI for interacting with multiple AI providers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "ppxai contributors" }
]
keywords = ["ai", "llm", "perplexity", "openai", "terminal", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.0.0",
    "httpx>=0.24.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "pyperclip>=1.8.0",
    "filetype>=1.2.0",  # Pure Python file type detection (replaces python-magic)
    "tree-sitter>=0.23",
    # Tree-sitter language packages for syntax highlighting (all 15 supported languages)
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-json>=0.24.8",
    "tree-sitter-yaml>=0.7.2",
    "tree-sitter-toml>=0.7.0",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-css>=0.25.0",
    "tree-sitter-markdown>=0.5.1",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-sql>=0.3.0",
    "tree-sitter-xml>=0.7.0",
    "tree-sitter-regex>=0.25.0",
]

[project.optional-dependencies]
# Server dependencies for HTTP + SSE (v1.9.0)
server = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sse-starlette>=1.6.0",
]

# MCP tool support
mcp = [
    "mcp>=0.1.0",
]

# Web search tool (DuckDuckGo)
search = [
    "ddgs>=9.0.0",
]

# Native Gemini provider (v1.12.5+)
# FROZEN at <1.57.0 — SDK 1.57.0+ regression breaks code editing (0% score).
# Before upgrading, verify fix for: https://github.com/googleapis/python-genai/issues/1789
# See docs/KNOWN-ISSUES.md for full context and upgrade verification steps.
gemini = [
    "google-genai>=1.0.0,<1.57.0",
]

# Data visualization support (v1.13.8)
data = [
    "pyyaml>=6.0",
    "python-hcl2>=4.3",
]

# Next-gen TUI with Textual (v1.15.0+)
tui = [
    "textual>=0.47.0",
    "textual-image>=0.8.0",
    "blinker>=1.7.0",  # Event bus for decoupled component communication
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

# Build dependencies
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
ppxai = "ppxai.rich.main:main"
ppxai-server = "ppxai.server.http:run_server"
ppxai-desktop = "ppxai.server.http:run_desktop"
ppxaide = "ppxai.tui:main"

[project.urls]
Homepage = "https://github.com/rcconsult/ppxai"
Repository = "https://github.com/rcconsult/ppxai"
Documentation = "https://github.com/rcconsult/ppxai#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ppxai"]

[dependency-groups]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    # Linting
    "ruff>=0.1.0",
    # Build tools
    "pyinstaller>=6.0.0",
    # Server (for local dev)
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sse-starlette>=1.6.0",
    # Gemini native SDK — FROZEN at <1.57.0 (see docs/KNOWN-ISSUES.md)
    "google-genai>=1.0.0,<1.57.0",
    # Web search (ddgs - renamed from duckduckgo-search)
    "ddgs>=9.0.0",
    # Interactive shell
    "ipython>=8.37.0",
    # Next-gen TUI (v1.15.0+)
    "textual>=0.47.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Exclude integration tests by default (they modify global config state)
# Run them explicitly with: pytest tests/test_custom_endpoint_integration.py -v
addopts = "--ignore=tests/test_custom_endpoint_integration.py"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
